<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ردیاب دکتر دکتاش</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&family=Lalezar&display=swap">
<style>
/* Layout: a shared header (title, deadline, head-to-head) over two deliberately different panels.
   Mohammad = ruled console with a ring gauge and day columns. Zahra = soft rounded trail with a spine bar and cumulative curve.
   Each panel's whole palette is driven by one hue (--h) and chroma (--c) chosen from the reading status, so the theme shifts with progress. */
:root{
  --font-body:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-display:'Lalezar','Vazirmatn',system-ui,sans-serif;
  /* lightness steps (light theme) */
  --l-page:.955; --l-surf:.995; --l-tint:.94; --l-line:.87; --l-ink:.24; --l-ink2:.47;
  --l-acc:.5; --l-soft:.925; --l-onacc:.99;
  --page-bg:oklch(var(--l-page) .012 265);
  --page-surf:oklch(var(--l-surf) .006 265);
  --page-ink:oklch(var(--l-ink) .02 265);
  --page-ink2:oklch(var(--l-ink2) .02 265);
  --page-line:oklch(var(--l-line) .012 265);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --l-page:.19; --l-surf:.235; --l-tint:.275; --l-line:.34; --l-ink:.95; --l-ink2:.76;
    --l-acc:.76; --l-soft:.32; --l-onacc:.2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --l-page:.19; --l-surf:.235; --l-tint:.275; --l-line:.34; --l-ink:.95; --l-ink2:.76;
  --l-acc:.76; --l-soft:.32; --l-onacc:.2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  direction:rtl; background:var(--page-bg); color:var(--page-ink);
  font-family:var(--font-body); font-size:15px; line-height:1.7;
  padding-block:28px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input{font:inherit}
.wrap{max-width:1200px; margin:0 auto}

/* header */
.top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:20px 48px; padding-bottom:22px; margin-bottom:26px; border-bottom:1px solid var(--page-line)}
.top>div{min-width:0}
.eyebrow{font-size:13px; color:var(--page-ink2)}
h1{font-family:var(--font-display); font-weight:400; font-size:clamp(46px,9vw,88px); line-height:1.05; margin:6px 0 10px; text-wrap:balance}
.vs{margin:0; font-size:15px; color:var(--page-ink2)}
.vs b{color:var(--page-ink)}
.meta{display:flex; gap:30px; flex-wrap:wrap}
.meta .k{font-size:12px; color:var(--page-ink2)}
.meta .v{font-size:26px; font-weight:700; line-height:1.3; font-variant-numeric:tabular-nums}
.meta .v small{font-size:13px; font-weight:400; color:var(--page-ink2); margin-inline-start:4px}

/* panels */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr)); gap:24px; align-items:start}
.panel{
  --h:262; --c:.03;
  --bg:oklch(var(--l-tint) calc(var(--c) * .5) var(--h));
  --surf:oklch(var(--l-surf) calc(var(--c) * .1) var(--h));
  --line:oklch(var(--l-line) calc(var(--c) * .35) var(--h));
  --ink:oklch(var(--l-ink) calc(var(--c) * .3) var(--h));
  --ink2:oklch(var(--l-ink2) calc(var(--c) * .3) var(--h));
  --acc:oklch(var(--l-acc) var(--c) var(--h));
  --soft:oklch(var(--l-soft) calc(var(--c) * .45) var(--h));
  --on-acc:oklch(var(--l-onacc) .01 var(--h));
  color:var(--ink); min-width:0;
  transition:background-color .7s ease, border-color .7s ease, color .7s ease;
}
.panel[data-status="idle"]{--h:262; --c:.03}
.panel[data-status="ahead"]{--h:205; --c:.11}
.panel[data-status="ontrack"]{--h:150; --c:.14}
.panel[data-status="behind"]{--h:88; --c:.14}
.panel[data-status="late"]{--h:52; --c:.17}
.panel[data-status="critical"]{--h:22; --c:.2}
.panel[data-status="done"]{--h:305; --c:.17}

.pill{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; padding:3px 12px}
.pill::before{content:""; width:8px; height:8px; border-radius:50%; background:currentColor}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}

.dayin{
  width:100%; text-align:center; color:var(--ink); background:var(--surf);
  border:1px solid var(--line); padding:5px 4px; font-variant-numeric:tabular-nums;
}
.dayin:focus-visible,.chip:focus-visible,.link:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.dayin:disabled{opacity:.45}
.chip{cursor:pointer; font-weight:700; color:var(--acc); background:transparent; border:1px solid var(--acc); padding:6px 16px; transition:background-color .2s, color .2s}
.chip:hover{background:var(--acc); color:var(--on-acc)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chart{display:block; width:100%; height:auto; direction:ltr}
.chart text{font-family:var(--font-body); font-variant-numeric:tabular-nums}
.tips{list-style:none; margin:0; padding:0; display:grid; gap:10px}

/* Mohammad: ruled console */
.pm{background:var(--surf); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.pm .hd{background:var(--soft); padding:20px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center; transition:background-color .7s ease}
.pm .nm{font-size:13px; font-weight:600; color:var(--ink2); letter-spacing:.04em}
.pm h2{font-size:32px; font-weight:800; line-height:1.2; margin:0 0 8px}
.pm .pill{background:var(--acc); color:var(--on-acc); border-radius:3px; transition:background-color .7s ease}
.pm .msg{grid-column:1/-1; border-top:1px solid var(--line); padding-top:14px}
.pm .msg h3{font-size:18px; margin:0 0 2px}
.pm .msg p{margin:0; color:var(--ink2)}
.pm .ring{width:132px; height:132px; display:block}
.pm .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:1px; background:var(--line); border-block:1px solid var(--line)}
.pm .stats>div{background:var(--surf); padding:12px 16px}
.pm .stats .l{font-size:12px; color:var(--ink2)}
.pm .stats .v{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.5}
.pm .sec{padding:16px 20px; border-bottom:1px solid var(--line)}
.pm .sec:last-child{border-bottom:0}
.pm .sec h4{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--ink2)}
.pm .chip{border-radius:4px}
.pm .dayin{border-radius:4px}
.pm .drow{display:grid; grid-template-columns:78px 66px minmax(40px,1fr) 62px; gap:10px; align-items:center; padding:6px 8px; border-top:1px dashed var(--line)}
.pm .drow:first-of-type{border-top:0}
.pm .drow.today{background:var(--soft); border-radius:4px}
.pm .dd b{display:block; font-size:14px; line-height:1.4}
.pm .dd span{font-size:11px; color:var(--ink2)}
.pm .pl{font-size:12px; color:var(--ink2)}
.pm .trk{height:8px; background:var(--line); border-radius:2px; overflow:hidden}
.pm .trk i{display:block; height:100%; background:var(--acc); transition:width .5s ease}
.pm .tips li{position:relative; padding-inline-start:18px}
.pm .tips li::before{content:""; position:absolute; inset-inline-start:0; top:.7em; width:7px; height:7px; background:var(--acc)}

/* Zahra: soft trail */
.pz{background:var(--bg); border-radius:32px; padding:26px 22px 22px; display:grid; gap:22px}
.pz .nm{font-size:13px; color:var(--ink2)}
.pz h2{font-family:var(--font-display); font-weight:400; font-size:48px; line-height:1.1; margin:0}
.pz .top2{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px}
.pz .pill{background:var(--soft); color:var(--acc); border-radius:999px; font-weight:800}
.pz .big{font-family:var(--font-display); font-size:clamp(64px,16vw,96px); line-height:1; color:var(--acc)}
.pz .big small{font-family:var(--font-body); font-size:15px; color:var(--ink2); margin-inline-start:8px}
.pz .bar{position:relative; height:26px; border-radius:999px; background:var(--surf); box-shadow:inset 0 0 0 1px var(--line); margin-top:14px}
.pz .bar i{position:absolute; top:3px; bottom:3px; inset-inline-start:3px; border-radius:999px; background:linear-gradient(to left,var(--acc),color-mix(in oklch,var(--acc) 62%,white)); transition:width .6s ease}
.pz .bar u{position:absolute; top:-6px; bottom:-6px; width:3px; background:var(--ink); border-radius:2px; text-decoration:none}
.pz .legend{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12px; color:var(--ink2); margin-top:10px}
.pz .msgz{background:var(--surf); border-radius:24px; padding:16px 20px}
.pz .msgz h3{margin:0 0 2px; font-size:19px}
.pz .msgz p{margin:0; color:var(--ink2)}
.pz .pebs{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
.pz .peb{background:var(--surf); border-radius:20px; padding:12px 16px}
.pz .peb .l{font-size:12px; color:var(--ink2)}
.pz .peb .v{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.5}
.pz h4{margin:0 0 10px; font-size:14px; font-weight:700}
.pz .chartbox{background:var(--surf); border-radius:24px; padding:14px 12px 8px}
.pz .chip{border-radius:999px; background:var(--surf)}
.pz .chip:hover{background:var(--acc)}
.pz .quick{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; background:var(--surf); border-radius:24px; padding:14px 18px}
.pz .quick span{font-weight:700}
.pz .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px}
.pz .tile{background:var(--surf); border-radius:20px; padding:10px 8px 8px; text-align:center; min-width:0}
.pz .tile.today{box-shadow:0 0 0 2px var(--acc)}
.pz .tile.off{opacity:.55}
.pz .tile svg{display:block; width:46px; height:46px; margin:0 auto 4px}
.pz .tile .wd{font-size:11px; color:var(--ink2); line-height:1.4; margin-bottom:6px}
.pz .dayin{border-radius:12px}
.pz .tips li{background:var(--surf); border-radius:20px; padding:12px 18px}

.note{margin:30px 0 0; padding-top:18px; border-top:1px solid var(--page-line); display:flex; flex-wrap:wrap; gap:10px 28px; justify-content:space-between; font-size:13px; color:var(--page-ink2)}
.note p{margin:0; max-width:62ch}
.note .acts{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.link{background:none; border:0; padding:2px 0; color:var(--page-ink); text-decoration:underline; text-underline-offset:4px; cursor:pointer}
@media (max-width:420px){
  .pm .hd{grid-template-columns:1fr}
  .pm .ring{margin:0 auto}
  .pz{padding:22px 14px 18px}
}
@media (prefers-reduced-motion: reduce){
  .panel,.panel *{transition:none !important}
}
</style>

<div class="wrap" lang="fa" dir="rtl">
  <header class="top">
    <div>
      <div class="eyebrow">ردیاب خواندن دو نفره · نوشته‌ی محمدعلی افغان</div>
      <h1>دکتر دکتاش</h1>
      <p class="vs" id="vs"></p>
    </div>
    <div class="meta">
      <div><div class="k">حجم کتاب</div><div class="v">۵۳۸<small>صفحه</small></div></div>
      <div><div class="k">مهلت</div><div class="v">۳۰ آبان</div></div>
      <div><div class="k" id="dlk">روز مانده</div><div class="v" id="dlv">—</div></div>
    </div>
  </header>

  <main class="grid">
    <section class="panel pm" id="p-mohammad" data-status="idle" aria-label="پیشرفت محمد"><div id="b-mohammad"></div></section>
    <section class="panel pz" id="p-zahra" data-status="idle" aria-label="پیشرفت زهرا"><div id="b-zahra" style="display:contents"></div></section>
  </main>

  <footer class="note">
    <p>برنامه‌ی پیشنهادی: روزی ۴۹ صفحه از ۱۹ تا ۲۹ آبان و ۳۰ آبان به‌عنوان روز ذخیره. زمان خواندن هر صفحه حدود ۲ دقیقه حساب شده است.</p>
    <div class="acts">
      <span id="sync">در حال اتصال به ذخیره‌ی مشترک…</span>
      <button class="link" id="pv" type="button">پیش‌نمایش تم وضعیت‌ها</button>
      <button class="link" id="pvx" type="button" hidden>خروج از پیش‌نمایش</button>
    </div>
  </footer>
</div>

<script>
(function(){
  var TOTAL=538, PER=49, MIN=2, NDAYS=12;
  var START=Date.UTC(2026,10,10);
  var READERS=[
    {id:'mohammad',name:'محمد',other:'زهرا',kind:'m'},
    {id:'zahra',name:'زهرا',other:'محمد',kind:'z'}
  ];
  var STATUS_LABEL={idle:'شروع نشده',ahead:'جلوتر از برنامه',ontrack:'طبق برنامه',behind:'کمی عقب',late:'عقب‌افتاده',critical:'بحرانی',done:'تمام شد'};
  var ORDER=['idle','ahead','ontrack','behind','late','critical','done'];
  var WEEK=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  var LS_KEY='daktash-tracker-v1';

  var state={mohammad:{days:zeros()},zahra:{days:zeros()}};
  var T=0, preview=-1;

  function zeros(){var a=[];for(var i=0;i<NDAYS;i++)a.push(0);return a}
  function fa(n){return Number(n).toLocaleString('fa-IR',{useGrouping:false})}
  function sum(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s}
  function planCum(i){return i<0?0:(i>=10?TOTAL:PER*(i+1))}
  function planRange(i){if(i<=9)return [PER*i+1,PER*(i+1)];if(i===10)return [491,538];return null}
  function weekday(i){return WEEK[new Date(START+i*864e5).getUTCDay()]}
  function dateLabel(i){var d=19+i;if(i<=11)return fa(d)+' آبان';if(d-30<=30)return fa(d-30)+' آذر';return 'بعد از آذر'}
  function fmtDur(m){
    m=Math.round(m); var h=Math.floor(m/60), r=m%60;
    var s=(h?fa(h)+' ساعت':'')+(h&&r?' و ':'')+(r?fa(r)+' دقیقه':'');
    return s||fa(0)+' دقیقه';
  }
  function computeT(){
    var n=new Date();
    return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-START)/864e5);
  }
  function sanitize(arr){
    var out=zeros(), left=TOTAL;
    for(var i=0;i<NDAYS;i++){
      var v=Math.max(0,Math.floor(Number(arr&&arr[i])||0));
      v=Math.min(v,left); out[i]=v; left-=v;
    }
    return out;
  }
  function parseNum(s){
    var map={'۰':0,'۱':1,'۲':2,'۳':3,'۴':4,'۵':5,'۶':6,'۷':7,'۸':8,'۹':9,'٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9};
    var o='';
    String(s).split('').forEach(function(ch){
      if(ch in map)o+=map[ch];else if(ch>='0'&&ch<='9')o+=ch;
    });
    return o?parseInt(o,10):0;
  }

  /* ---------- analysis ---------- */
  function analyze(r){
    var days=state[r.id].days, total=sum(days), remaining=TOTAL-total;
    var tc=Math.max(0,Math.min(T,11));
    var targetEnd=T<0?0:planCum(tc);
    var targetStart=T<=0?0:planCum(tc-1);
    var daysLeft=T>11?0:NDAYS-Math.max(T,0);
    var req=daysLeft?Math.ceil(remaining/daysLeft):remaining;
    var surplus=total-targetEnd, deficit=targetStart-total;
    var todayLeft=Math.max(0,targetEnd-total);
    var st;
    if(total>=TOTAL)st='done';
    else if(T>11)st='critical';
    else if(total===0&&T<=0)st='idle';
    else if(surplus>=PER)st='ahead';
    else if(total>=targetStart)st='ontrack';
    else if(req>110||deficit>147)st='critical';
    else if(deficit>PER)st='late';
    else st='behind';
    var elapsed=Math.max(1,Math.min(Math.max(T,0),11)+((T>=0&&days[tc]>0)?1:0));
    var pace=total/elapsed, eta=null;
    if(total>=TOTAL)eta=null;
    else if(pace>0)eta=tc+Math.ceil(remaining/pace);
    var pct=total>=TOTAL?100:Math.floor(total/TOTAL*100);
    return {days:days,total:total,remaining:remaining,tc:tc,targetEnd:targetEnd,targetStart:targetStart,daysLeft:daysLeft,req:req,surplus:surplus,deficit:Math.max(0,deficit),todayLeft:todayLeft,status:st,pace:pace,eta:eta,pct:pct};
  }

  function advice(st,a,r){
    var o=r.other, n=fa;
    switch(st){
      case 'idle': return {
        h:'هنوز شروع نشده',
        p:'اولین هدف '+n(PER)+' صفحه است، حدود '+fmtDur(PER*MIN)+' مطالعه. صفحه‌ی اول رو همین الان می‌تونی باز کنی.',
        tips:[
          'ساعت و جای ثابتی برای مطالعه انتخاب کن؛ مثلاً ۴۵ دقیقه قبل از خواب.',
          'جلسه‌ی اول رو کوتاه شروع کن. ۲۵ دقیقه معمولاً برای گرفتن ریتم کافیه.',
          'گوشی رو روی «مزاحم نشوید» بذار تا تمرکزت نپره.'
        ]};
      case 'ahead': return {
        h:'جلوتر از برنامه‌ای',
        p:n(a.surplus)+' صفحه از برنامه جلوتری، یعنی حدود '+n(Math.floor(a.surplus/PER))+' روز مطالعه.',
        tips:[
          'همین ریتم رو نگه دار. لازم نیست سرعتت رو بیشتر کنی.',
          'اگه زودتر تمام کنی، روز ذخیره‌ی ۳۰ آبان کاملاً آزاد می‌مونه.',
          'موقع حرف زدن با '+o+' مراقب اسپویل باش؛ شاید هنوز به این بخش نرسیده باشه.'
        ]};
      case 'ontrack': return {
        h:'در مسیر درستی',
        p:a.todayLeft>0
          ?'تا هدف امروز '+n(a.todayLeft)+' صفحه مونده، حدود '+fmtDur(a.todayLeft*MIN)+'.'
          :'هدف امروز انجام شد. می‌تونی همین‌جا تمومش کنی یا کمی جلو بیفتی.',
        tips:[
          'هدف روزانه '+n(PER)+' صفحه‌ست. اگه امروز تموم شد، فردا هم همین‌قدر کافیه.',
          'برای روزهای شلوغ، ۱۰ تا ۱۵ صفحه‌ی اضافه جلو بیفت تا استرس جبران نداشته باشی.',
          'بعد از هر جلسه یه خط درباره‌ی چیزی که یادت موند بنویس.'
        ]};
      case 'behind': return {
        h:'کمی عقب افتاده‌ای',
        p:n(a.deficit)+' صفحه از برنامه عقبی. امروز '+n(a.todayLeft)+' صفحه بخون تا دوباره به برنامه برسی.',
        tips:[
          'سهم امروزت رو به دو نوبت تقسیم کن؛ یه نوبت صبح و یه نوبت شب.',
          'یه نیم‌ساعت از وقت‌های بی‌هدف رو بده به کتاب.',
          'روز ذخیره‌ی ۳۰ آبان هنوز دست‌نخورده‌ست، پس جای نگرانی نیست.'
        ]};
      case 'late': return {
        h:'عقب‌افتادگی جدی',
        p:n(a.deficit)+' صفحه عقبی. از الان روزی '+n(a.req)+' صفحه بخون تا ۳۰ آبان تموم شه.',
        tips:[
          'برنامه‌ی ۴۹ صفحه‌ای دیگه جواب نمی‌ده. سقف جدیدت روزی '+n(a.req)+' صفحه‌ست، یعنی '+fmtDur(a.req*MIN)+' در روز.',
          'ببین کدوم ساعت‌های روز رو می‌تونی آزاد کنی و اون‌ها رو توی تقویم برای کتاب ببند.',
          'روزهای تعطیل رو برای جلسه‌های بلندتر نگه دار.'
        ]};
      case 'critical': return {
        h:'وضعیت بحرانی',
        p:T>11
          ?'مهلت ۳۰ آبان تموم شده و '+n(a.remaining)+' صفحه مونده.'
          :n(a.remaining)+' صفحه مونده و '+n(a.daysLeft)+' روز وقت داری؛ یعنی روزی '+n(a.req)+' صفحه.',
        tips:[
          'واقع‌بین باش: اگه ۳۰ آبان شدنی نیست، یه مهلت جدید تعیین کن تا انگیزه‌ت از بین نره.',
          'بخش‌های کوتاه رو برای شب‌های خسته بذار و جلسه‌های بلند رو برای روزهای آزاد.',
          'حتی ۲۰ صفحه در روز از هیچی بهتره؛ از امشب شروع کن.'
        ]};
      default: return {
        h:'کتاب تمام شد',
        p:'هر '+n(TOTAL)+' صفحه رو خوندی. تبریک!',
        tips:[
          'اگه '+o+' هم تموم کرده باشه، حالا می‌تونید بدون نگرانی از اسپویل درباره‌ی پایان کتاب حرف بزنید.',
          'جمله‌ها و صحنه‌های مورد علاقه‌ت رو یه‌جا جمع کن.',
          'وقتشه کتاب بعدی رو انتخاب کنی.'
        ]};
    }
  }

  /* ---------- charts ---------- */
  function chartM(a,r){
    var W=360,H=172,pl=6,pr=30,pt=16,pb=24,pw=W-pl-pr,ph=H-pt-pb;
    var days=a.days, mx=Math.max(60,Math.ceil(Math.max.apply(null,days)/10)*10);
    var step=pw/NDAYS, bw=step*.62;
    function fx(i){return W-pr-(i+.5)*step}
    function fy(v){return pt+ph-(v/mx)*ph}
    var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="صفحات خوانده‌شده در هر روز">';
    [0,PER,mx].forEach(function(v){
      s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+fy(v)+'" y2="'+fy(v)+'" stroke="var(--line)" stroke-width="1"'+(v===PER?' stroke-dasharray="4 3" style="stroke:var(--ink2)"':'')+'/>';
      s+='<text x="'+(W-pr+5)+'" y="'+(fy(v)+3.5)+'" font-size="10" text-anchor="start" fill="var(--ink2)">'+fa(v)+'</text>';
    });
    for(var i=0;i<NDAYS;i++){
      var future=(T<=11&&i>a.tc);
      var isToday=(T>=0&&T<=11&&i===T);
      if(!future){
        var v=days[i];
        if(v>0){
          var full=(v>=PER)||(i===11);
          var y=fy(v);
          s+='<rect x="'+(fx(i)-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(pt+ph-y)+'" rx="1.5" fill="var(--acc)" opacity="'+(full?1:.6)+'"/>';
          s+='<text x="'+fx(i)+'" y="'+(y-3)+'" font-size="9" text-anchor="middle" fill="var(--ink)">'+fa(v)+'</text>';
        }else{
          s+='<rect x="'+(fx(i)-bw/2)+'" y="'+(pt+ph-2)+'" width="'+bw+'" height="2" fill="var(--ink2)" opacity=".4"/>';
        }
      }
      s+='<text x="'+fx(i)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="'+(isToday?'var(--ink)':'var(--ink2)')+'" font-weight="'+(isToday?800:400)+'">'+fa(19+i)+'</text>';
    }
    return s+'</svg>';
  }

  function chartZ(a,r){
    var W=360,H=196,pl=6,pr=34,pt=16,pb=26,pw=W-pl-pr,ph=H-pt-pb;
    var step=pw/NDAYS;
    function fx(j){return W-pr-j*step}
    function fy(v){return pt+ph-(v/TOTAL)*ph}
    var days=a.days;
    var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="مجموع صفحات خوانده‌شده نسبت به برنامه">';
    [0,200,400,TOTAL].forEach(function(v){
      s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+fy(v)+'" y2="'+fy(v)+'" stroke="var(--line)" stroke-width="1"/>';
      s+='<text x="'+(W-pr+5)+'" y="'+(fy(v)+3.5)+'" font-size="10" text-anchor="start" fill="var(--ink2)">'+fa(v)+'</text>';
    });
    var pp=[];
    for(var j=0;j<=NDAYS;j++)pp.push(fx(j).toFixed(1)+','+fy(j===0?0:planCum(j-1)).toFixed(1));
    s+='<polyline points="'+pp.join(' ')+'" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    var upto=T<0?-1:Math.min(T,11);
    if(upto>=0){
      var pts=[[fx(0),fy(0)]], cum=0;
      for(var i=0;i<=upto;i++){cum+=days[i];pts.push([fx(i+1),fy(cum)])}
      var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
      var last=pts[pts.length-1];
      s+='<polygon points="'+fx(0).toFixed(1)+','+fy(0)+' '+line+' '+last[0].toFixed(1)+','+fy(0)+'" fill="var(--acc)" fill-opacity=".2"/>';
      s+='<polyline points="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
      s+='<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.6" fill="var(--acc)" stroke="var(--surf)" stroke-width="2"/>';
    }
    for(var k=0;k<NDAYS;k++){
      var isT=(T>=0&&T<=11&&k===T);
      s+='<text x="'+fx(k+1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="'+(isT?'var(--ink)':'var(--ink2)')+'" font-weight="'+(isT?800:400)+'">'+fa(19+k)+'</text>';
    }
    return s+'</svg>';
  }

  /* ---------- views ---------- */
  function dayInput(r,i,a){
    var enabled=(T>11)||(i<=T);
    var v=a.days[i];
    return '<input class="dayin" id="in-'+r.id+'-'+i+'" data-r="'+r.id+'" data-i="'+i+'" type="text" inputmode="numeric" autocomplete="off" placeholder="'+fa(0)+'" value="'+(v?fa(v):'')+'"'+(enabled?'':' disabled')+' aria-label="صفحات '+r.name+' در '+dateLabel(i)+'">';
  }
  function chipsFor(r){
    return '<div class="chips">'+[5,10,25].map(function(n){
      return '<button class="chip" type="button" data-add="'+n+'" data-r="'+r.id+'">+'+fa(n)+'</button>';
    }).join('')+'</div>';
  }

  function viewM(r,a,st){
    var adv=advice(st,a,r);
    var R=52, C=2*Math.PI*R, off=C*(1-a.total/TOTAL), ang=(a.targetEnd/TOTAL)*360;
    var etaTxt=a.eta===null?(st==='done'?'تمام شد':'—'):dateLabel(a.eta);
    var etaOk=(a.eta!==null&&a.eta<=11);
    var ring='<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="'+fa(a.pct)+' درصد کتاب خوانده شده">'+
      '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="12"/>'+
      '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--acc)" stroke-width="12" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 70 70)"/>'+
      '<g transform="rotate('+ang.toFixed(2)+' 70 70)"><line x1="70" y1="8" x2="70" y2="28" stroke="var(--ink)" stroke-width="3"/></g>'+
      '<text x="70" y="77" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)" style="font-family:var(--font-body)">'+fa(a.pct)+'٪</text>'+
      '<text x="70" y="97" text-anchor="middle" font-size="11" fill="var(--ink2)" style="font-family:var(--font-body)">نشانه = جای برنامه</text>'+
      '</svg>';
    var rows='';
    for(var i=0;i<NDAYS;i++){
      var rg=planRange(i), isT=(T>=0&&T<=11&&i===T), w=Math.min(100,a.days[i]/PER*100);
      rows+='<div class="drow'+(isT?' today':'')+'">'+
        '<div class="dd"><b>'+dateLabel(i)+'</b><span>'+weekday(i)+(isT?' · امروز':'')+'</span></div>'+
        '<div class="pl">'+(rg?fa(rg[0])+' تا '+fa(rg[1]):'ذخیره')+'</div>'+
        '<div class="trk"><i style="width:'+w.toFixed(1)+'%"></i></div>'+
        dayInput(r,i,a)+'</div>';
    }
    return '<div class="hd">'+
        '<div><div class="nm">خواننده</div><h2>'+r.name+'</h2><span class="pill">'+STATUS_LABEL[st]+'</span></div>'+ring+
        '<div class="msg"><h3>'+adv.h+'</h3><p>'+adv.p+'</p></div>'+
      '</div>'+
      '<div class="stats">'+
        '<div><div class="l">خوانده‌شده</div><div class="v">'+fa(a.total)+' صفحه</div></div>'+
        '<div><div class="l">مانده</div><div class="v">'+fa(a.remaining)+' صفحه</div></div>'+
        '<div><div class="l">جای برنامه امروز</div><div class="v">صفحه '+fa(a.targetEnd)+'</div></div>'+
        '<div><div class="l">لازم در هر روز</div><div class="v">'+(a.daysLeft?fa(a.req)+' صفحه':'—')+'</div></div>'+
        '<div><div class="l">پایان با این سرعت</div><div class="v">'+etaTxt+'</div></div>'+
        '<div><div class="l">زمان مطالعه‌ی مانده</div><div class="v">'+fmtDur(a.remaining*MIN)+'</div></div>'+
      '</div>'+
      '<div class="sec"><h4>افزودن به امروز</h4>'+chipsFor(r)+'</div>'+
      '<div class="sec"><h4>صفحات هر روز در برابر هدف '+fa(PER)+' صفحه</h4>'+chartM(a,r)+'</div>'+
      '<div class="sec"><h4>ثبت روزانه</h4>'+rows+'</div>'+
      '<div class="sec"><h4>نکته‌ها برای وضعیت «'+STATUS_LABEL[st]+'»</h4><ul class="tips">'+adv.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div>';
  }

  function viewZ(r,a,st){
    var adv=advice(st,a,r);
    var p=a.total/TOTAL, e=a.targetEnd/TOTAL;
    var etaTxt=a.eta===null?(st==='done'?'تمام شد':'—'):dateLabel(a.eta);
    var tiles='';
    for(var i=0;i<NDAYS;i++){
      var isT=(T>=0&&T<=11&&i===T), enabled=(T>11)||(i<=T);
      var f=Math.min(1,a.days[i]/PER), C=2*Math.PI*17;
      tiles+='<div class="tile'+(isT?' today':'')+(enabled?'':' off')+'">'+
        '<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="var(--line)" stroke-width="5"/>'+
        '<circle cx="22" cy="22" r="17" fill="none" stroke="var(--acc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+(C*(1-f)).toFixed(2)+'" transform="rotate(-90 22 22)"/>'+
        '<text x="22" y="26" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)" style="font-family:var(--font-body)">'+fa(19+i)+'</text></svg>'+
        '<div class="wd">'+weekday(i)+(isT?' · امروز':'')+'</div>'+
        dayInput(r,i,a)+'</div>';
    }
    return '<div class="top2"><div><div class="nm">خواننده</div><h2>'+r.name+'</h2></div><span class="pill">'+STATUS_LABEL[st]+'</span></div>'+
      '<div><div class="big">'+fa(a.total)+'<small>از '+fa(TOTAL)+' صفحه</small></div>'+
        '<div class="bar" role="img" aria-label="'+fa(a.pct)+' درصد کتاب خوانده شده"><i style="width:calc((100% - 6px) * '+p.toFixed(4)+')"></i><u style="inset-inline-start:calc(3px + (100% - 6px) * '+e.toFixed(4)+' - 1.5px)"></u></div>'+
        '<div class="legend"><span>'+fa(a.pct)+'٪ خوانده شده</span><span>خط عمودی: جای برنامه، صفحه '+fa(a.targetEnd)+'</span></div></div>'+
      '<div class="msgz"><h3>'+adv.h+'</h3><p>'+adv.p+'</p></div>'+
      '<div class="pebs">'+
        '<div class="peb"><div class="l">مانده</div><div class="v">'+fa(a.remaining)+' صفحه</div></div>'+
        '<div class="peb"><div class="l">لازم در هر روز</div><div class="v">'+(a.daysLeft?fa(a.req)+' صفحه':'—')+'</div></div>'+
        '<div class="peb"><div class="l">پایان با این سرعت</div><div class="v">'+etaTxt+'</div></div>'+
        '<div class="peb"><div class="l">زمان مطالعه‌ی مانده</div><div class="v">'+fmtDur(a.remaining*MIN)+'</div></div>'+
      '</div>'+
      '<div class="quick"><span>افزودن به امروز</span>'+chipsFor(r)+'</div>'+
      '<div class="chartbox"><h4>مجموع صفحات در برابر برنامه</h4>'+chartZ(a,r)+'</div>'+
      '<div><h4>ثبت روزانه</h4><div class="tiles">'+tiles+'</div></div>'+
      '<div><h4>نکته‌ها برای وضعیت «'+STATUS_LABEL[st]+'»</h4><ul class="tips">'+adv.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul></div>';
  }

  /* ---------- render ---------- */
  function vsLine(){
    var m=sum(state.mohammad.days), z=sum(state.zahra.days);
    if(m>=TOTAL&&z>=TOTAL)return 'هر دو کتاب رو تموم کردید.';
    if(m===0&&z===0)return 'هیچ‌کدوم هنوز شروع نکردید. اولین صفحه رو کی می‌خونه؟';
    if(m===z)return 'هر دو به یک اندازه خوندید.';
    return '<b>'+(m>z?'محمد':'زهرا')+'</b> '+fa(Math.abs(m-z))+' صفحه جلوتره.';
  }
  function render(){
    READERS.forEach(function(r){
      var a=analyze(r);
      var st=preview>=0?ORDER[preview]:a.status;
      var panel=document.getElementById('p-'+r.id);
      panel.setAttribute('data-status',st);
      document.getElementById('b-'+r.id).innerHTML=(r.kind==='m'?viewM(r,a,st):viewZ(r,a,st));
    });
    document.getElementById('vs').innerHTML=vsLine();
    var dl=T>11?0:NDAYS-Math.max(T,0);
    document.getElementById('dlv').innerHTML=T>11?'تمام شد':fa(dl)+'<small>روز</small>';
    document.getElementById('dlk').textContent=T>11?'مهلت':'مانده تا ۳۰ آبان';
    var pv=document.getElementById('pv'), pvx=document.getElementById('pvx');
    pv.textContent=preview<0?'پیش‌نمایش تم وضعیت‌ها':'پیش‌نمایش: '+STATUS_LABEL[ORDER[preview]]+' (بعدی)';
    pvx.hidden=preview<0;
  }

  /* ---------- storage ---------- */
  function localSave(){
    try{localStorage.setItem(LS_KEY,JSON.stringify({m:state.mohammad.days,z:state.zahra.days}))}catch(e){}
  }
  function localLoad(){
    try{
      var raw=localStorage.getItem(LS_KEY); if(!raw)return;
      var d=JSON.parse(raw);
      if(d.m)state.mohammad.days=sanitize(d.m);
      if(d.z)state.zahra.days=sanitize(d.z);
    }catch(e){}
  }
  var db=null, blocked=false, writing={}, pending={}, dirty={}, timers={}, seeded={}, gotDef={};
  function setSync(k){
    var el=document.getElementById('sync');
    var t={
      connecting:'در حال اتصال به ذخیره‌ی مشترک…',
      ok:'ذخیره‌ی مشترک فعال است',
      local:'فقط روی همین دستگاه ذخیره می‌شود',
      readonly:'این حساب اجازه‌ی ذخیره‌ی مشترک ندارد؛ فقط روی همین دستگاه ذخیره می‌شود',
      slow:'ذخیره‌ی مشترک در دسترس نیست؛ فعلاً روی همین دستگاه ذخیره می‌شود',
      error:'ذخیره‌ی مشترک موقتاً انجام نشد؛ روی همین دستگاه نگه داشته شد'
    };
    el.textContent=t[k]||'';
  }
  function queueCloud(rid){
    if(!db||blocked)return;
    dirty[rid]=true; clearTimeout(timers[rid]);
    timers[rid]=setTimeout(function(){flush(rid,0)},500);
  }
  function flush(rid,attempt){
    if(writing[rid]){pending[rid]=true;return}
    writing[rid]=true; pending[rid]=false;
    db.doc('readers/'+rid).set({days:state[rid].days.slice(),updated:Date.now()}).then(function(){
      dirty[rid]=false; writing[rid]=false; setSync('ok');
      if(pending[rid])flush(rid,0);
    }).catch(function(e){
      writing[rid]=false;
      var code=e&&e.code;
      if(code==='unavailable'&&attempt<1){setTimeout(function(){flush(rid,attempt+1)},800+Math.random()*700);return}
      if(code==='invalid_argument'){blocked=true;setSync('readonly')}else setSync('error');
    });
  }
  function subscribe(rid){
    db.doc('readers/'+rid).onSnapshot(function(snap){
      if(!snap.metadata.fromCache){gotDef[rid]=true; clearTimeout(slowTimer)}
      if(snap.exists){
        var d=snap.data();
        if(d&&Array.isArray(d.days)&&!dirty[rid]&&!writing[rid]){
          state[rid].days=sanitize(d.days); localSave(); render();
        }
        if(gotDef[rid])setSync(blocked?'readonly':'ok');
      }else if(!snap.metadata.fromCache&&!seeded[rid]){
        seeded[rid]=true;
        if(sum(state[rid].days)>0)flush(rid,0);
        setSync(blocked?'readonly':'ok');
      }
    },function(){setSync('local')});
  }
  var slowTimer=null;
  function initCloud(){
    var p=null;
    try{ if(window.claude&&window.claude.use)p=window.claude.use('db') }catch(e){}
    slowTimer=setTimeout(function(){setSync('slow')},10000);
    if(!p){clearTimeout(slowTimer);setSync('local');return}
    p.then(function(d){
      if(!d){clearTimeout(slowTimer);setSync('local');return}
      db=d; subscribe('mohammad'); subscribe('zahra');
    }).catch(function(){clearTimeout(slowTimer);setSync('local')});
  }

  /* ---------- edits ---------- */
  function setDay(rid,i,val){
    var days=state[rid].days, others=sum(days)-days[i];
    days[i]=Math.max(0,Math.min(val,TOTAL-others));
    localSave(); queueCloud(rid); render();
  }
  function rd(id){return READERS.filter(function(r){return r.id===id})[0]}

  document.addEventListener('click',function(ev){
    var b=ev.target.closest&&ev.target.closest('[data-add]');
    if(b){
      var rid=b.getAttribute('data-r'), n=parseInt(b.getAttribute('data-add'),10);
      var tc=Math.max(0,Math.min(T,11));
      setDay(rid,tc,state[rid].days[tc]+n);
    }
  });
  document.addEventListener('change',function(ev){
    var el=ev.target;
    if(el&&el.classList&&el.classList.contains('dayin')){
      setDay(el.getAttribute('data-r'),parseInt(el.getAttribute('data-i'),10),parseNum(el.value));
    }
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'&&ev.target&&ev.target.classList&&ev.target.classList.contains('dayin'))ev.target.blur();
  });
  document.getElementById('pv').addEventListener('click',function(){
    preview=(preview+1)%ORDER.length; render();
  });
  document.getElementById('pvx').addEventListener('click',function(){preview=-1;render()});

  /* ---------- boot ---------- */
  T=computeT();
  localLoad();
  render();
  initCloud();
  setInterval(function(){
    var nt=computeT();
    if(nt!==T){T=nt;render()}
  },60000);
})();
</script>

</body></html>
